name: Playwright Tests CI/CD

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Select which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ui
          - api
          - smoke
          - regression
          - functional
          - integration

jobs:
  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        id: tests
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TEST_TAG="${{ inputs.test_tag }}"
          else
            TEST_TAG="all"
          fi
          
          echo "🎭 Running Playwright tests with tag: $TEST_TAG"
          
          case "$TEST_TAG" in
            all)
              echo "Running all tests"
              npm test
              ;;
            ui)
              echo "Running @ui tests"
              npm run test:ui
              ;;  
            api)
              echo "Running @api tests"
              npm run test:api
              ;;
            smoke)
              echo "Running @smoke tests"
              npm run test:smoke
              ;;
            regression)
              echo "Running @regression tests"
              npm run test:regression
              ;;
            functional)
              echo "Running @functional tests"
              npm run test:functional
              ;;
            integration)
              echo "Running @integration tests"
              npm run test:integration
              ;;
          esac

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results (JSON/JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "**Test Tag:** \`${{ inputs.test_tag }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Test Tag:** \`all\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "**Status:** ${{ steps.tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View detailed report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
